# Render Blueprint — CareerOS API + admin portal + managed PostgreSQL.
#
# Render → New → Blueprint → pick this repository. Render reads this file and creates every
# service below. Values marked `sync: false` are prompted for at deploy time (or set later in the
# dashboard) — they are deployment-specific or secret, so they are never committed here.
#
# Plans: `free` is fine for a first launch/test (services sleep when idle and free Postgres is
# time-limited by Render's own policy). For real users switch both web services and the database to
# a paid instance type in the dashboard — no file change needed.
#
# See docs/launch/RENDER_LAUNCH.md for the full runbook, including the values to paste.

databases:
  - name: careeros-db
    databaseName: careeros
    user: careeros
    plan: free
    postgresMajorVersion: "17"

services:
  # ---------------------------------------------------------------- API (FastAPI, Docker image)
  - type: web
    name: careeros-api
    runtime: docker
    plan: free
    region: frankfurt # closest of Render's regions to Nigeria; change before the first deploy if you prefer another
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /
    autoDeployTrigger: commit
    # Migrations run before the server starts, so a deploy can never serve an older schema.
    # One async worker fits the free instance's 512 MB (and keeps the in-process scheduler
    # single-leader); raise `--workers` when you move to a paid plan.
    dockerCommand: >-
      sh -c "alembic upgrade head &&
      exec gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --workers 1
      --bind 0.0.0.0:8000 --timeout 60 --graceful-timeout 30 --access-logfile - --error-logfile -"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: careeros-db
          property: connectionString
      # Generated by Render and never shown to anyone who doesn't open the dashboard.
      - key: JWT_SECRET_KEY
        generateValue: true
      # Fernet key for encrypting stored OAuth tokens. Generate it yourself (the runbook has the
      # one-line command) — it must be a valid 44-character urlsafe-base64 Fernet key.
      - key: TOKEN_ENCRYPTION_KEYS
        sync: false
      # The admin portal's public URL, e.g. https://careeros-admin.onrender.com
      - key: CORS_ORIGINS
        sync: false
      # This API's own public URL, e.g. https://careeros-api.onrender.com — used to build media URLs.
      - key: PUBLIC_BASE_URL
        sync: false
      # First admin account, created once at startup. Use a strong password and change it after
      # the first login.
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      # Release kill switches: Gmail/Outlook tracking ship OFF until their OAuth apps exist and
      # Google's restricted-scope verification is done (see DEPLOYMENT.md).
      - key: GMAIL_TRACKING_ENABLED
        value: "false"
      - key: OUTLOOK_TRACKING_ENABLED
        value: "false"
      # Career-feed discovery: on, but publishing stays manual until you trust a source.
      - key: CAREER_SOURCE_SYNC_ENABLED
        value: "true"
      - key: SOURCE_AUTO_PUBLISH_ENABLED
        value: "false"
      - key: OUTBOUND_TLS_TRUST_STORE
        value: certifi
      # Imports the bundled content pack (companies, opportunities, news, source registry, practice
      # question banks and their images) on every start. Idempotent, content-only — and it also
      # restores media after a deploy, since Render's filesystem resets. Turn off once you keep
      # content only in the live database (see docs/launch/RENDER_LAUNCH.md).
      - key: BOOTSTRAP_CONTENT
        value: "true"

  # ---------------------------------------------------------------- Admin portal (Next.js)
  - type: web
    name: careeros-admin
    runtime: node
    plan: free
    region: frankfurt
    rootDir: admin
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeployTrigger: commit
    envVars:
      # Baked into the browser bundle at build time: the API's public URL + /api/v1, e.g.
      # https://careeros-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NODE_VERSION
        value: "20"
