name: careeros
description: CareerOS — Your Career Intelligence & Opportunity Platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management / routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Networking
  dio: ^5.7.0

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Local storage
  drift: ^2.20.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_secure_storage: ^11.1.1
  shared_preferences: ^2.3.2

  # Media / files
  file_picker: ^12.3.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1

  # Audio recording / playback (Phase 7.5 — real interview answer recording)
  record: ^7.1.1
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1

  # Charts
  fl_chart: ^0.69.0

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Monetization
  google_mobile_ads: ^9.1.0

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.20.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/brand/
