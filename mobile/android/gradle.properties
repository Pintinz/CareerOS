org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Maven Central intermittently 403s a fraction of concurrent artifact requests from this
# network (confirmed: direct curl to the same URL succeeds most of the time, fails ~25% under
# concurrency) — these retry individual resource downloads instead of failing the whole build.
org.gradle.internal.repository.max.tentatives=10
org.gradle.internal.repository.initial.backoff=500
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
