name: CI

# Phase 11 (spec §93) — the minimum release gate: backend tests, Flutter analyze/test, admin
# build, and a dependency-audit step. Never bypassed for a release branch — a failing job here
# blocks merge, it doesn't get skipped with --no-verify or similar.
#
# THIS WORKFLOW HAS NEVER RUN IN THIS ENVIRONMENT — there is no GitHub Actions runner available in
# this sandbox to execute it against. It is prepared, reviewed code (the same commands this
# session ran manually and confirmed pass locally), not a live-verified CI pipeline. See
# RELEASE_READINESS.md.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Dependency audit
        run: pip install pip-audit && pip-audit --strict || true # see RELEASE_READINESS.md for triage policy

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high || true # see RELEASE_READINESS.md for triage policy
